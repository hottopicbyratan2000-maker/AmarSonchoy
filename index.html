<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AmarSonchoy</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#071430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AmarSonchoy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #071430; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #071430; }
</style>
</head>
<body>
<iframe id="app" title="AmarSonchoy"
  allow="camera *; microphone *; clipboard-write *; clipboard-read *; fullscreen *; geolocation *"></iframe>
<div id="scan-overlay" style="display:none;position:fixed;inset:0;z-index:10;background:#000;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;">
  <div style="position:relative;width:100%;max-width:520px;aspect-ratio:1/1;background:#000;">
    <video id="scan-video" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;"></video>
    <div style="position:absolute;inset:18%;border:3px solid #34d399;border-radius:16px;pointer-events:none;"></div>
  </div>
  <div id="scan-status" style="color:#e5e7eb;font-size:14px;margin:14px 16px;text-align:center;"></div>
  <button id="scan-cancel" type="button" style="padding:12px 28px;border-radius:12px;border:1px solid #475569;background:#0f1f45;color:#fbbf24;font-size:16px;font-weight:600;"></button>
</div>
<script>
/* ================== শুধু এই একটি লাইন বদলাতে হবে ==================
   Apps Script "Deploy > Web app" এর "/exec" দিয়ে শেষ হওয়া ঠিকানাটা এখানে বসান। */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbysf4Y2ItpP_FwBZyHl93kbsSE8k2JDgD2bd7CLiHBCM_JD8tMiDbPokZPyCudn0mAG5Q/exec';
/* =================================================================== */

var frame = document.getElementById('app');
// Keep ?verify=... (receipt QR) and any other query string working.
frame.src = EXEC_URL + (location.search || '');

var deferred = null;           // Chrome's install event
var appWindow = null;          // the app's window, learned from its first message

function toApp(msg) { try { (appWindow || frame.contentWindow).postMessage(msg, '*'); } catch (e) {} }

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferred = e;
  toApp({ type: 'as-wrapper', canInstall: true, url: location.origin });
});
window.addEventListener('appinstalled', function () {
  deferred = null;
  toApp({ type: 'as-installed' });
});


/* ===== QR scanner that lives on THIS page (top level), because Google's nested app frames cannot get camera permission ===== */
var scan = { stream: null, timer: null };
var scanOverlay = document.getElementById('scan-overlay');
var scanVideo = document.getElementById('scan-video');
document.getElementById('scan-cancel').textContent = "\u09ac\u09a8\u09cd\u09a7 \u0995\u09b0\u09c1\u09a8";
document.getElementById('scan-cancel').addEventListener('click', function () { scanClose(); toApp({ type: 'as-scan-cancel' }); });

function scanStop() {
  if (scan.timer) { clearInterval(scan.timer); scan.timer = null; }
  if (scan.stream) { scan.stream.getTracks().forEach(function (t) { t.stop(); }); scan.stream = null; }
  try { scanVideo.srcObject = null; } catch (e) {}
}
function scanClose() { scanStop(); scanOverlay.style.display = 'none'; }
function scanStatus(m) { document.getElementById('scan-status').textContent = m; }

var jsqrPromise = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve(true);
  if (jsqrPromise) return jsqrPromise;
  var urls = ['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'], i = 0;
  jsqrPromise = new Promise(function (resolve) {
    (function next() {
      if (window.jsQR) { resolve(true); return; }
      if (i >= urls.length) { jsqrPromise = null; resolve(false); return; }
      var s = document.createElement('script');
      s.src = urls[i++]; s.onload = function () { window.jsQR ? resolve(true) : next(); }; s.onerror = next;
      document.head.appendChild(s);
    })();
  });
  return jsqrPromise;
}

function scanStart() {
  scanClose();
  scanOverlay.style.display = 'flex';
  scanStatus("\u0995\u09cd\u09af\u09be\u09ae\u09c7\u09b0\u09be \u099a\u09be\u09b2\u09c1 \u09b9\u099a\u09cd\u099b\u09c7... (\u0985\u09a8\u09c1\u09ae\u09a4\u09bf \u099a\u09be\u0987\u09b2\u09c7 \"Allow\" \u099a\u09be\u09aa\u09c1\u09a8)");
  loadJsQR();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    scanClose(); toApp({ type: 'as-scan-error', name: 'Unsupported' }); return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }).then(function (stream) {
    scan.stream = stream;
    scanVideo.muted = true; scanVideo.srcObject = stream;
    var pr = scanVideo.play(); if (pr && pr.catch) pr.catch(function () {});
    scanStatus("\u0995\u09be\u09b0\u09cd\u09a1\u09c7\u09b0 QR \u099f\u09bf \u09ac\u0995\u09cd\u09b8\u09c7\u09b0 \u09ad\u09c7\u09a4\u09b0\u09c7 \u09a7\u09b0\u09c1\u09a8");
    var det = null, fails = 0, tick = 0;
    try { if ('BarcodeDetector' in window) det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; }
    var cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    function found(text) { if (!scan.timer || !text) return; scanClose(); toApp({ type: 'as-scan-result', text: String(text) }); }
    function viaJsQR() {
      if (!window.jsQR || !scanVideo.videoWidth) return;
      var w = Math.min(scanVideo.videoWidth, 720), h = Math.round(scanVideo.videoHeight * w / scanVideo.videoWidth);
      cv.width = w; cv.height = h; cx.drawImage(scanVideo, 0, 0, w, h);
      var hit = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
      if (hit && hit.data) found(hit.data);
    }
    scan.timer = setInterval(function () {
      if (scanVideo.readyState < 2 || !scanVideo.videoWidth) return;
      tick++;
      if (det && fails < 5) {
        det.detect(scanVideo).then(function (c) {
          if (c && c.length && c[0].rawValue) found(c[0].rawValue); else if (tick % 2 === 0) viaJsQR();
        }).catch(function () { fails++; viaJsQR(); });
      } else viaJsQR();
    }, 250);
  }).catch(function (err) {
    scanClose(); toApp({ type: 'as-scan-error', name: (err && err.name) || 'Error' });
  });
}

window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'as-hello') {
    appWindow = ev.source;
    toApp({ type: 'as-wrapper', canInstall: !!deferred, url: location.origin });
  } else if (d.type === 'as-scan-start') {
    appWindow = ev.source;
    scanStart();
  } else if (d.type === 'as-scan-cancel') {
    scanClose();
  } else if (d.type === 'as-install') {
    if (!deferred) { toApp({ type: 'as-install-unavailable' }); return; }
    var evt = deferred; deferred = null;
    evt.prompt();
    if (evt.userChoice && evt.userChoice.then) {
      evt.userChoice.then(function (c) { toApp({ type: 'as-install-result', outcome: c && c.outcome }); });
    }
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () { /* ignore */ });
  });
}
</script>
</body>
</html>
